<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>{% block title %}工作日志{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}">工作日志</a>
    {% if request.endpoint != 'login' %}
      <nav>
        <a href="{{ url_for('dashboard') }}">填报</a>
        <a href="{{ url_for('history') }}">历史</a>
        <a href="{{ url_for('settings') }}">设置</a>
      </nav>
      {% if auth_enabled %}
        <form class="logout" method="post" action="{{ url_for('logout') }}">
          <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
          <button class="link-button" type="submit">退出</button>
        </form>
      {% endif %}
    {% endif %}
  </header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="notice {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
