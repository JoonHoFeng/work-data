{% extends "base.html" %}
{% block title %}登录 · 工作日志{% endblock %}
{% block content %}
<section class="login-card card">
  <h1>工作日志</h1>
  <p class="muted">请输入访问密码</p>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>访问密码<input name="password" type="password" required autofocus></label>
    <button class="primary" type="submit">进入</button>
  </form>
</section>
{% endblock %}
